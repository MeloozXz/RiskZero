<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SeguranApp VPN</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-box">
        <svg class="logo-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        <div>
          <h1 class="logo-title">SeguranApp</h1>
          <span class="logo-subtitle">VPN de Navegador • v2.0</span>
        </div>
      </div>
      <span class="mode-badge">Proxy Real</span>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Power Button -->
      <div class="button-wrapper">
        <div id="pulseRing" class="pulse-ring hidden"></div>
        <button id="powerBtn" class="power-button">
          <div class="power-inner">
            <svg class="power-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
              <line x1="12" y1="2" x2="12" y2="12"></line>
            </svg>
            <span id="powerText" class="power-text">LIGAR</span>
          </div>
        </button>
      </div>

      <!-- Status Indicator -->
      <div id="statusBadge" class="status-badge disconnected">
        <span class="status-dot"></span>
        <span id="statusText">VPN DESCONECTADA</span>
      </div>

      <!-- Timer -->
      <div class="timer-box">
        <span class="timer-label">Duração:</span>
        <span id="timerValue" class="timer-value">00:00:00</span>
      </div>

      <!-- Node Selector -->
      <div class="section-title">Selecionar Servidor / Região:</div>
      <div class="server-select-box">
        <select id="serverSelect" class="server-select">
          <option value="de-fra">🇩🇪 Alemanha (Frankfurt am Main)</option>
          <option value="br-spo">🇧🇷 Brasil (São Paulo - SP3)</option>
          <option value="us-mia">🇺🇸 Estados Unidos (Miami)</option>
          <option value="uk-lon">🇬🇧 Reino Unido (Londres)</option>
          <option value="local-bridge">Conexão rápida (Anycast)</option>
          <option value="custom">Servidor próprio (proxy remoto)</option>
        </select>
      </div>

      <!-- Custom Proxy Configuration Form (collapsible) -->
      <div id="customConfigSection" class="custom-config-box hidden">
        <div class="custom-config-title">Configurar Servidor Próprio (Evasão DPI)</div>
        <div class="config-grid">
          <div class="form-row">
            <label class="form-label">Protocolo:</label>
            <select id="customScheme" class="input-field select-field">
              <option value="https">HTTPS (Recomendado • Porta 443)</option>
              <option value="socks5">SOCKS5</option>
              <option value="http">HTTP</option>
            </select>
          </div>
          <div class="form-row">
            <label class="form-label">Host / IP:</label>
            <input type="text" id="customHost" placeholder="ex: 198.51.100.1 ou vpn.site.com" class="input-field" />
          </div>
          <div class="form-row">
            <label class="form-label">Porta:</label>
            <input type="number" id="customPort" placeholder="ex: 1080" class="input-field" />
          </div>
          <div class="form-row">
            <label class="form-label">Usuário (opcional):</label>
            <input type="text" id="customUser" placeholder="Usuário" class="input-field" />
          </div>
          <div class="form-row">
            <label class="form-label">Senha (opcional):</label>
            <input type="password" id="customPass" placeholder="Senha" class="input-field" />
          </div>
        </div>
        <button id="saveCustomBtn" class="btn-save-custom">
          <span>Salvar Configuração</span>
        </button>
      </div>

      <!-- Quick Test Actions -->
      <div class="test-action-box">
        <button id="testIpBtn" class="btn-test-ip">
          <span>Verificar IP público</span>
        </button>
        <button id="testMapsBtn" class="btn-test-maps">
          <span>Ver localização no mapa</span>
        </button>
        <button id="testAppAuditBtn" class="btn-audit-test">
          <span>Abrir painel web</span>
        </button>
      </div>

      <!-- Emergency Reset Action -->
      <div class="reset-action-box">
        <button id="resetProxyBtn" class="btn-reset-proxy" title="Limpa o proxy e restaura o acesso direto à internet">
          <span>Restaurar conexão direta</span>
        </button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>SeguranApp • Tunelamento Real & Geolocalização Segura</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
